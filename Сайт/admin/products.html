<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары - Админ-панель PerfectSound38</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Боковое меню -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <i class="bi bi-music-note-beamed"></i>
                <span>PerfectSound38</span>
                <small>Админ-панель</small>
            </div>
            <nav class="admin-nav">
                <ul>
                    <li><a href="index.html"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                    <li class="active"><a href="products.html"><i class="bi bi-guitar"></i> Товары</a></li>
                    <li><a href="orders.html"><i class="bi bi-cart-check"></i> Заказы</a></li>
                    <li><a href="users.html"><i class="bi bi-people"></i> Пользователи</a></li>
                    <li><a href="/index.html"><i class="bi bi-box-arrow-left"></i> На сайт</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Основное содержимое -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Управление товарами</h1>
                <div class="admin-user">
                    <img src="images/admin.jpg" alt="Администратор">
                    <span>Администратор</span>
                </div>
            </header>

            <div class="admin-content">
                <div class="d-flex justify-content-between mb-4">
                    <div class="admin-search">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Поиск товаров...">
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        <i class="bi bi-plus"></i> Добавить товар
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Изображение</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Цена</th>
                                <th>Наличие</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            <!-- Товары будут загружены через JS -->
                        </tbody>
                    </table>
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center mt-4">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1">Назад</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Вперед</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>

    <!-- Модальное окно добавления товара -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">Добавить новый товар</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="productName" class="form-label">Название товара</label>
                                    <input type="text" class="form-control" id="productName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="productCategory" class="form-label">Категория</label>
                                    <select class="form-select" id="productCategory" required>
                                        <option value="">Выберите категорию</option>
                                        <option value="guitars">Гитары</option>
                                        <option value="keyboards">Клавишные</option>
                                        <option value="drums">Ударные</option>
                                        <option value="wind">Духовые</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="productPrice" class="form-label">Цена (₽)</label>
                                    <input type="number" class="form-control" id="productPrice" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="productImage" class="form-label">Изображение</label>
                                    <input class="form-control" type="file" id="productImage">
                                    <div class="form-text">Рекомендуемый размер: 800x600px</div>
                                </div>
                                <div class="mb-3">
                                    <label for="productStock" class="form-label">Количество на складе</label>
                                    <input type="number" class="form-control" id="productStock" value="1" min="0">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="productActive" checked>
                                    <label class="form-check-label" for="productActive">Активный товар</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productDescription" class="form-label">Описание</label>
                            <textarea class="form-control" id="productDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveProductBtn">Сохранить товар</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/product.js"></script>
</body>
</html>
