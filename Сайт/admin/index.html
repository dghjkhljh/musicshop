<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - PerfectSound38</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Боковое меню -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <i class="bi bi-music-note-beamed"></i>
                <span>PerfectSound38</span>
                <small>Админ-панель</small>
            </div>
            <nav class="admin-nav">
                <ul>
                <li class="active"><a href="admin/index.html"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                    <li><a href="products.html"><i class="bi bi-guitar"></i> Товары</a></li>
                    <li><a href="orders.html"><i class="bi bi-cart-check"></i> Заказы</a></li>
                    <li><a href="users.html"><i class="bi bi-people"></i> Пользователи</a></li>
                    <li><a href="/index.html"><i class="bi bi-box-arrow-left"></i> На сайт</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Основное содержимое -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Дашборд</h1>
                <div class="admin-user">
                    <img src="images/admin.jpg" alt="Администратор">
                    <span>Администратор</span>
                </div>
            </header>

            <div class="admin-content">
                <div class="row">
                    <div class="col-md-3">
                        <div class="admin-card bg-primary text-white">
                            <h3>Товары</h3>
                            <p id="products-count">0</p>
                            <i class="bi bi-guitar"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="admin-card bg-success text-white">
                            <h3>Заказы</h3>
                            <p id="orders-count">0</p>
                            <i class="bi bi-cart-check"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="admin-card bg-warning text-dark">
                            <h3>Пользователи</h3>
                            <p id="users-count">0</p>
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="admin-card bg-danger text-white">
                            <h3>Доход</h3>
                            <p id="revenue">0 ₽</p>
                            <i class="bi bi-currency-ruble"></i>
                        </div>
                    </div>
                </div>

                <div class="admin-section mt-4">
                    <h2>Последние заказы</h2>
                    <div class="table-responsive">
                        <table class="table admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Покупатель</th>
                                    <th>Дата</th>
                                    <th>Сумма</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders">
                                <!-- Заполняется через JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
