<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар - PS38</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">MusicShop</div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <div class="cart">
                <a href="cart.html">Корзина (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="product-page">
            <div class="product-images">
                <img src="" alt="Изображение товара" id="main-image">
                <div class="thumbnails" id="thumbnails">
                    <!-- Миниатюры будут добавлены через JS -->
                </div>
            </div>

            <div class="product-details">
                <h1 class="product-title" id="product-title">Название товара</h1>
                <div class="product-price" id="product-price">0 ₽</div>
                <div class="product-rating">
                    <div class="stars">★★★★☆</div>
                    <span class="reviews-count">(0 отзывов)</span>
                </div>
                
                <button class="add-to-cart" id="add-to-cart-btn">Добавить в корзину</button>
                
                <div class="product-specs">
                    <h3>Характеристики</h3>
                    <table class="specs-table" id="specs-table">
                        <!-- Характеристики будут добавлены через JS -->
                    </table>
                </div>
                
                <div class="product-description">
                    <h3>Описание</h3>
                    <p id="product-description">Описание товара...</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 PS38. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        // Данные товаров (обычно получаются с сервера)
        const products = {
            1: {
                id: 1,
                name: "Fender Stratocaster",
                price: 45000,
                category: "Электрогитары",
                brand: "Fender",
                country: "США",
                weight: "3.5 кг",
                description: "Легендарная электрогитара с фирменным звуком. Корпус из ольхи, гриф из клена, 22 лада. Идеальный выбор для различных музыкальных стилей.",
                images: [
                    "images/guitar1.jpg",
                    "images/guitar1-thumb1.jpg",
                    "images/guitar1-thumb2.jpg"
                ],
                specs: {
                    "Тип": "Электрогитара",
                    "Бренд": "Fender",
                    "Страна производства": "США",
                    "Материал корпуса": "Ольха",
                    "Материал грифа": "Клен",
                    "Количество ладов": "22",
                    "Вес": "3.5 кг",
                    "Гарантия": "2 года"
                }
            },
            2: {
                id: 2,
                name: "Yamaha P-125",
                price: 65000,
                category: "Цифровые пианино",
                brand: "Yamaha",
                country: "Япония",
                weight: "22 кг",
                description: "Цифровое пианино с молоточковой механикой и 88 взвешенными клавишами. Отличное звучание и реалистичная игра.",
                images: [
                    "images/piano1.jpg",
                    "images/piano1-thumb1.jpg",
                    "images/piano1-thumb2.jpg"
                ],
                specs: {
                    "Тип": "Цифровое пианино",
                    "Бренд": "Yamaha",
                    "Страна производства": "Япония",
                    "Количество клавиш": "88 (взвешенные)",
                    "Полифония": "192 ноты",
                    "Вес": "22 кг",
                    "Гарантия": "3 года"
                }
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            // Получаем ID товара из URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            const product = products[productId];
            
            if (!product) {
                // Если товар не найден
                document.querySelector('main').innerHTML = `
                    <div class="product-not-found">
                        <h2>Товар не найден</h2>
                        <p>Извините, запрашиваемый товар не существует или был удален.</p>
                        <a href="catalog.html" class="back-to-catalog">Вернуться в каталог</a>
                    </div>
                `;
                return;
            }
            
            // Заполняем данные товара
            document.getElementById('product-title').textContent = product.name;
            document.getElementById('product-price').textContent = product.price.toLocaleString() + ' ₽';
            document.getElementById('product-description').textContent = product.description;
            
            // Устанавливаем главное изображение
            const mainImage = document.getElementById('main-image');
            mainImage.src = product.images[0];
            mainImage.alt = product.name;
            
            // Добавляем миниатюры
            const thumbnailsContainer = document.getElementById('thumbnails');
            product.images.slice(1).forEach(imgSrc => {
                const thumbnail = document.createElement('img');
                thumbnail.src = imgSrc;
                thumbnail.alt = product.name;
                thumbnail.className = 'thumbnail';
                thumbnail.addEventListener('click', () => {
                    mainImage.src = imgSrc;
                });
                thumbnailsContainer.appendChild(thumbnail);
            });
            
            // Заполняем характеристики
            const specsTable = document.getElementById('specs-table');
            for (const [key, value] of Object.entries(product.specs)) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${key}</td>
                    <td>${value}</td>
                `;
                specsTable.appendChild(row);
            }
            
            // Обработчик кнопки "Добавить в корзину"
            document.getElementById('add-to-cart-btn').addEventListener('click', function() {
                // Получаем текущую корзину из localStorage
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                
                // Добавляем товар в корзину
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.images[0]
                });
                
                // Сохраняем обновленную корзину
                localStorage.setItem('cart', JSON.stringify(cart));
                
                // Обновляем счетчик корзины
                updateCartCount();
                
                // Показываем уведомление
                alert('Товар добавлен в корзину!');
            });
            
            // Функция обновления счетчика корзины
            function updateCartCount() {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                document.getElementById('cart-count').textContent = cart.length;
            }
            
            // Инициализируем счетчик
            updateCartCount();
        });
    </script>
</body>
</html>
