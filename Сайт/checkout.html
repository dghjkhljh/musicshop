<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - PS38</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Perfect Sound 38</div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <div class="cart">
                <a href="cart.html">Корзина (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Оформление заказа</h1>
        
        <div class="checkout-container">
            <div class="checkout-form">
                <form id="order-form">
                    <h2>Контактная информация</h2>
                    <div class="form-group">
                        <label for="name">ФИО*</label>
                        <input type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Телефон*</label>
                        <input type="tel" id="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email*</label>
                        <input type="email" id="email" required>
                    </div>
                    
                    <h2>Способ доставки</h2>
                    <div class="form-group">
                        <select id="delivery-method">
                            <option value="courier">Курьером (до двери)</option>
                            <option value="pickup">Самовывоз (г. Иркутск, ул. Баумана, 214)</option>
                            <option value="post">Почта России</option>
                        </select>
                    </div>
                    
                    <div class="form-group delivery-address">
                        <label for="address">Адрес доставки*</label>
                        <textarea id="address" rows="3" required></textarea>
                    </div>
                    
                    <h2>Способ оплаты</h2>
                    <div class="payment-methods">
                        <div class="payment-method">
                            <input type="radio" id="payment-card" name="payment" value="card" checked>
                            <label for="payment-card">Банковской картой онлайн</label>
                        </div>
                        
                        <div class="payment-method">
                            <input type="radio" id="payment-cash" name="payment" value="cash">
                            <label for="payment-cash">Наличными при получении</label>
                        </div>
                        
                        <div class="payment-method">
                            <input type="radio" id="payment-sbp" name="payment" value="sbp">
                            <label for="payment-sbp">СБП (Система быстрых платежей)</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="comments">Комментарий к заказу</label>
                        <textarea id="comments" rows="3"></textarea>
                    </div>
                    
                    <button type="submit" class="submit-order">Подтвердить заказ</button>
                </form>
            </div>
            
            <div class="checkout-summary">
                <h2>Ваш заказ</h2>
                <div class="order-items" id="order-items">
                    <!-- Товары будут подгружаться через JS -->
                </div>
                <div class="order-totals">
                    <div class="order-row">
                        <span>Товары:</span>
                        <span id="subtotal">0 ₽</span>
                    </div>
                    <div class="order-row">
                        <span>Доставка:</span>
                        <span id="delivery-cost">0 ₽</span>
                    </div>
                    <div class="order-row total">
                        <span>Итого:</span>
                        <span id="order-total">0 ₽</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 PS38. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загрузка товаров в корзине
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const orderItems = document.getElementById('order-items');
            const subtotalElement = document.getElementById('subtotal');
            const deliveryCostElement = document.getElementById('delivery-cost');
            const orderTotalElement = document.getElementById('order-total');
            
            if (cart.length === 0) {
                orderItems.innerHTML = '<p>Ваша корзина пуста</p>';
                return;
            }
            
            // Отображение товаров
            orderItems.innerHTML = cart.map(item => `
                <div class="order-item">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} ₽</div>
                </div>
            `).join('');
            
            // Расчет стоимости
            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const deliveryCost = calculateDeliveryCost();
            const total = subtotal + deliveryCost;
            
            subtotalElement.textContent = subtotal.toLocaleString() + ' ₽';
            deliveryCostElement.textContent = deliveryCost === 0 ? 'Бесплатно' : deliveryCost.toLocaleString() + ' ₽';
            orderTotalElement.textContent = total.toLocaleString() + ' ₽';
            
            // Обработка формы
            document.getElementById('order-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Собираем данные формы
                const orderData = {
                    customer: {
                        name: document.getElementById('name').value,
                        phone: document.getElementById('phone').value,
                        email: document.getElementById('email').value,
                        address: document.getElementById('address').value
                    },
                    delivery: document.getElementById('delivery-method').value,
                    payment: document.querySelector('input[name="payment"]:checked').value,
                    comments: document.getElementById('comments').value,
                    items: cart,
                    total: total
                };
                
                // Здесь должна быть отправка данных на сервер
                console.log('Order data:', orderData);
                
                // Очищаем корзину
                localStorage.removeItem('cart');
                
                // Перенаправляем на страницу благодарности
                window.location.href = 'thank-you.html';
            });
            
            // Расчет стоимости доставки
            function calculateDeliveryCost() {
                const method = document.getElementById('delivery-method').value;
                
                if (method === 'pickup') {
                    return 0;
                } else if (method === 'courier') {
                    return 500; // Пример стоимости курьерской доставки
                } else {
                    return 800; // Пример стоимости почтовой доставки
                }
            }
            
            // Обновляем стоимость при изменении способа доставки
            document.getElementById('delivery-method').addEventListener('change', function() {
                const deliveryCost = calculateDeliveryCost();
                const total = subtotal + deliveryCost;
                
                deliveryCostElement.textContent = deliveryCost === 0 ? 'Бесплатно' : deliveryCost.toLocaleString() + ' ₽';
                orderTotalElement.textContent = total.toLocaleString() + ' ₽';
            });
        });
    </script>
</body>
</html>
